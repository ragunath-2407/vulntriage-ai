<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>VulnTriage AI</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

<div class="container">


    <!-- HEADER -->

    <header>

        <div class="logo">
            🛡️
        </div>

        <div>

            <h1>
                VulnTriage AI
            </h1>

            <p>
                Personalized Vulnerability Prioritization
            </p>

        </div>

    </header>


    <!-- ORGANIZATION -->

    <section class="card">

        <h2>
            🏢 Organisation Profile
        </h2>


        <label>
            Organisation Name
        </label>

        <input
            id="organizationName"
            placeholder="Example: ABC Technologies"
        >


        <label>
            Primary Technology
        </label>

        <input
            id="organizationTechnology"
            placeholder="Example: Python / FastAPI"
        >


        <label>
            Technology Version
        </label>

        <input
            id="organizationVersion"
            placeholder="Example: Python 3.12"
        >


        <label>
            Exposure
        </label>

        <select id="organizationExposure">

            <option value="Internet">
                Internet
            </option>

            <option value="External">
                External
            </option>

            <option value="Internal">
                Internal
            </option>

        </select>

    </section>


    <!-- FILE -->

    <section class="card">

        <h2>
            📂 Vulnerability Records
        </h2>

        <p>
            Upload a CSV containing your vulnerability records.
        </p>


        <input
            type="file"
            id="csvFile"
            accept=".csv"
        >


        <div
            id="recordCount"
            class="record-count"
        >
            No file selected
        </div>

    </section>


    <!-- SAMPLE DATA -->

    <section class="card">

        <h2>
            🧪 Demo
        </h2>

        <button
            onclick="loadDemoData()"
            class="secondary"
        >
            Load Demo Vulnerabilities
        </button>

    </section>


    <!-- RUN -->

    <button
        id="analyzeButton"
        onclick="runTriage()"
        class="analyze"
    >

        🔍 Analyze & Find Top 5 Priorities

    </button>


    <div
        id="loading"
        class="loading"
    >

        ⏳ Analyzing vulnerabilities...

    </div>


    <!-- TOP 5 -->

    <section
        id="prioritySection"
        class="card hidden"
    >

        <h2>
            🚨 Top 5 Security Priorities
        </h2>

        <div id="priorityCards"></div>

    </section>


    <!-- AI -->

    <section
        id="aiSection"
        class="card hidden"
    >

        <h2>
            🤖 Featherless AI Analysis
        </h2>

        <div
            id="aiAnalysis"
            class="ai-analysis"
        ></div>

    </section>


</div>


<script
    src="https://cdn.jsdelivr.net/npm/papaparse@5.4.3/papaparse.min.js">
</script>

<script src="script.js"></script>

</body>

</html>
